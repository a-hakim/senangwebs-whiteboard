<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWW Undo/Redo Test</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        
        .test-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        
        .test-sidebar {
            width: 200px;
            background: white;
            border-right: 1px solid #e0e0e0;
            padding: 20px;
            overflow-y: auto;
        }
        
        .test-canvas {
            flex: 1;
            height: 100%;
        }
        
        .test-button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .test-button:hover {
            background: #007bff;
            color: white;
        }
        
        .test-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-sidebar">
            <h3>Undo/Redo Test</h3>
            
            <div class="test-info">
                Test the undo/redo functionality by:
                <br>1. Drawing some shapes
                <br>2. Moving them around
                <br>3. Changing colors
                <br>4. Using Ctrl+Z to undo
                <br>5. Using Ctrl+Y to redo
            </div>
            
            <button class="test-button" onclick="createTestShape()">Add Rectangle</button>
            <button class="test-button" onclick="createTestCircle()">Add Circle</button>
            <button class="test-button" onclick="changeColors()">Change Colors</button>
            <button class="test-button" onclick="testUndo()">Undo (Ctrl+Z)</button>
            <button class="test-button" onclick="testRedo()">Redo (Ctrl+Y)</button>
            <button class="test-button" onclick="clearCanvas()">Clear All</button>
            
            <div class="test-info" id="historyInfo">
                History: 0 states
            </div>
        </div>
        
        <div class="test-canvas" id="drawing-canvas"></div>
    </div>

    <script src="sww.js"></script>
    <script>
        let swwInstance;
        
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('drawing-canvas');
            
            swwInstance = sww.init(container, {
                backgroundColor: '#ffffff',
                gridSize: 20,
                showGrid: true
            });
            
            console.log('SWW Undo/Redo Test initialized!');
            updateHistoryInfo();
            
            // Update history info whenever state changes
            setInterval(updateHistoryInfo, 1000);
        });
        
        function createTestShape() {
            const rect = {
                id: swwInstance.generateId(),
                type: 'rectangle',
                x: Math.random() * 300 + 100,
                y: Math.random() * 200 + 100,
                width: 100,
                height: 80,
                strokeColor: '#007bff',
                strokeWidth: 2,
                fillColor: '#e3f2fd',
                fillStyle: 'solid',
                opacity: 0.8,
                rotation: 0
            };
            
            swwInstance.elements.push(rect);
            swwInstance.createSVGElement(rect);
            swwInstance.saveStateToHistory('createTestShape');
            updateHistoryInfo();
        }
        
        function createTestCircle() {
            const circle = {
                id: swwInstance.generateId(),
                type: 'ellipse',
                x: Math.random() * 300 + 100,
                y: Math.random() * 200 + 100,
                width: 90,
                height: 90,
                strokeColor: '#28a745',
                strokeWidth: 2,
                fillColor: '#d4edda',
                fillStyle: 'solid',
                opacity: 0.8,
                rotation: 0
            };
            
            swwInstance.elements.push(circle);
            swwInstance.createSVGElement(circle);
            swwInstance.saveStateToHistory('createTestCircle');
            updateHistoryInfo();
        }
        
        function changeColors() {
            const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff', '#44ffff'];
            
            swwInstance.elements.forEach(element => {
                element.strokeColor = colors[Math.floor(Math.random() * colors.length)];
                swwInstance.updateSVGElement(element);
            });
            
            swwInstance.saveStateToHistory('changeColors');
            updateHistoryInfo();
        }
        
        function testUndo() {
            swwInstance.undo();
            updateHistoryInfo();
        }
        
        function testRedo() {
            swwInstance.redo();
            updateHistoryInfo();
        }
        
        function clearCanvas() {
            swwInstance.clearAll();
            updateHistoryInfo();
        }
        
        function updateHistoryInfo() {
            const info = document.getElementById('historyInfo');
            if (swwInstance && swwInstance.historyStack) {
                info.textContent = `History: ${swwInstance.historyStack.length} states, Index: ${swwInstance.historyIndex}`;
            }
        }
    </script>
</body>
</html>
