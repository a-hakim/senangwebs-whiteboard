<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SenangWebs Whiteboard</title>
    
    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- SWW Library Files -->
    <link rel="stylesheet" href="sww.css" />
    <script src="sww.js"></script>
</head>
<body>
    <!-- Main Application Container -->
    <div class="sww-editor-container">
        
        <!-- Left Control Panel -->
        <div class="sww-control-panel" id="sww-control-panel">
            
            <!-- Panel Header -->
            <div class="sww-control-header">
                SW Whiteboard
            </div>
            
            <!-- Menu Navigation -->
            <div class="sww-control-menu">
                <button class="sww-control-menu-button active" data-menu="elements">
                    <i class="fas fa-vector-square"></i>
                    <span>Elements</span>
                </button>
                <button class="sww-control-menu-button" data-menu="layers">
                    <i class="fas fa-layer-group"></i>
                    <span>Layers</span>
                </button>
            </div>

            <!-- Elements Section -->
            <div id="sww-elements-section" class="sww-control-section">
                <div class="sww-elements-grid">
                    <button class="sww-action-button" onclick="swwInstance.setTool('rectangle')">
                        <i class="far fa-square"></i> Rectangle
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('ellipse')">
                        <i class="far fa-circle"></i> Ellipse
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('diamond')">
                        <i class="far fa-square" style="rotate: 45deg;"></i> Diamond
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('parallelogram')">
                        <i class="far fa-square" style="transform: skew(-15deg, 0deg);"></i> Parallelogram
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('star')">
                        <i class="far fa-star"></i> Star
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('arrow')">
                        <i class="fas fa-arrow-right"></i> Arrow
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('text')">
                        <i class="fas fa-font"></i> Text
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('image')">
                        <i class="fas fa-image"></i> Image
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('website')">
                        <i class="fas fa-globe"></i> Website
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('markdown')">
                        <i class="fas fa-file-alt"></i> Document
                    </button>
                </div>
            </div>
            
            <!-- Layers Section -->
            <div id="sww-layers-section" class="sww-control-section" style="display: none;">
                <div class="sww-layer-header">
                    <span>Layers (<span id="layer-count">0</span>)</span>
                    <div class="sww-layer-actions">
                        <button class="sww-layer-action-btn" onclick="selectAllLayers()" title="Select All">
                            <i class="fas fa-check-square"></i>
                        </button>
                        <button class="sww-layer-action-btn" onclick="clearLayerSelection()" title="Clear Selection">
                            <i class="far fa-square"></i>
                        </button>
                        <button class="sww-layer-action-btn" onclick="duplicateSelectedLayers()" title="Duplicate">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="sww-layer-action-btn" onclick="deleteSelectedLayers()" title="Delete Selected">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                
                <div class="sww-layers-container" id="sww-layers-list">
                    <div id="no-layers-message" class="sww-info-text" style="text-align: center; padding: 20px;">
                        No elements in the scene.<br>
                        Add elements using the tools to see them here.
                    </div>
                </div>
            </div>
            
            <!-- Customize Section -->
            <div id="sww-customize-section" class="sww-control-section" style="display: none;">
                <div style="padding: 20px; text-align: center; color: #ffffff80;">
                    No elements selected. Select an element to customize its properties.
                </div>
            </div>

        </div>

        <!-- Main Canvas Area -->
        <div class="sww-canvas-area" id="sww-drawing-canvas"></div>
        
    </div>

    <!-- Bottom Toolbar -->
    <div class="sww-toolbar-container">
        
        <!-- Zoom Controls -->
        <div id="sww-zoom" class="sww-toolbar-action">
            <button class="sww-toolbar-button" onclick="swwInstance.zoomIn()" title="Zoom In">
                <i class="fas fa-search-plus"></i>
            </button>
            <button class="sww-toolbar-button" onclick="swwInstance.zoomOut()" title="Zoom Out">
                <i class="fas fa-search-minus"></i>
            </button>
        </div>
        
        <!-- Action Controls -->
        <div id="sww-action" class="sww-toolbar-action">
            <button class="sww-toolbar-button" onclick="undoAction()" title="Undo">
                <i class="fas fa-undo"></i>
            </button>
            <button class="sww-toolbar-button" onclick="redoAction()" title="Redo">
                <i class="fas fa-redo"></i>
            </button>
            <button class="sww-toolbar-button" onclick="saveScene()" title="Save Scene">
                <i class="fas fa-save"></i>
            </button>
            <button class="sww-toolbar-button" onclick="selectAllObjects()" title="Select All">
                <i class="fas fa-check-double"></i>
            </button>
            <button class="sww-toolbar-button" onclick="clearCanvas()" title="Clear Canvas">
                <i class="fas fa-eraser"></i>
            </button>
        </div>
        
        <!-- Menu Controls -->
        <div id="sww-menu" class="sww-toolbar-action">
            <!-- <button class="sww-toolbar-button" onclick="exportSVG()" title="Export SVG">
                <i class="fas fa-download"></i>
            </button> -->
            <button class="sww-toolbar-button" onclick="swwInstance.toggleGrid()" title="Toggle Grid">
                <i class="fas fa-border-none"></i>
            </button>
        </div>
        
    </div>

    <!-- Application Logic -->
    <script>
        // Global variables
        let swwInstance;
        let swwControlPanel;

        /**
         * Initialize the application when DOM is ready
         */
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("sww-drawing-canvas");

            // Initialize SWW drawing library
            swwInstance = sww.init(container, {
                backgroundColor: "#ffffff",
                gridSize: 20,
                showGrid: true,
            });

            // Initialize control panel
            swwControlPanel = new SWWControlPanel(swwInstance);

            console.log("SenangWebs Whiteboard initialized successfully!");
        });
    </script>
</body>
</html>
