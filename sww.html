<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SenangWebs Whiteboard</title>
    
    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- SWW Library Files -->
    <link rel="stylesheet" href="sww.css" />
    <script src="sww.js"></script>
</head>
<body>
    <!-- Main Application Container -->
    <div class="sww-editor-container">
        
        <!-- Left Control Panel -->
        <div class="sww-control-panel" id="sww-control-panel">
            
            <!-- Panel Header -->
            <div class="sww-control-header">
                <div><h4>SW Whiteboard</h4></div>
                <div class="sww-control-header-actions">
                    <button class="sww-panel-button" onclick="togglePanelWidth()" title="Expand Panel Width" id="toggle-width-btn">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button class="sww-panel-button active" onclick="togglePanelDock()" title="Dock Panel" id="toggle-dock-btn">
                        <i class="fas fa-bookmark"></i>
                    </button>
                </div>
            </div>
            
            <!-- Menu Navigation -->
            <div class="sww-control-menu">
                <button class="sww-control-menu-button active" data-menu="elements">
                    <i class="fas fa-vector-square"></i>
                    <span>Elements</span>
                </button>
                <button class="sww-control-menu-button" data-menu="layers">
                    <i class="fas fa-layer-group"></i>
                    <span>Layers</span>
                </button>
            </div>

            <!-- Elements Section -->
            <div id="sww-elements-section" class="sww-control-section">
                <div class="sww-elements-grid">
                    <button class="sww-action-button" onclick="swwInstance.setTool('rectangle')">
                        <i class="far fa-square"></i> Rectangle
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('ellipse')">
                        <i class="far fa-circle"></i> Ellipse
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('diamond')">
                        <i class="far fa-square" style="rotate: 45deg;"></i> Diamond
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('parallelogram')">
                        <i class="far fa-square" style="transform: skew(-15deg, 0deg);"></i> Parallelogram
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('star')">
                        <i class="far fa-star"></i> Star
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('arrow')">
                        <i class="fas fa-arrow-right"></i> Arrow
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('text')">
                        <i class="fas fa-font"></i> Text
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('image')">
                        <i class="fas fa-image"></i> Image
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('website')">
                        <i class="fas fa-globe"></i> Website
                    </button>
                    <button class="sww-action-button" onclick="swwInstance.setTool('markdown')">
                        <i class="fas fa-file-alt"></i> Document
                    </button>
                </div>
            </div>
            
            <!-- Layers Section -->
            <div id="sww-layers-section" class="sww-control-section" style="display: none;">
                <div class="sww-layer-header">
                    <span>Layers (<span id="layer-count">0</span>)</span>
                    <div class="sww-layer-actions">
                        <button class="sww-layer-action-btn" onclick="swwInstance.selectAll()" title="Select All">
                            <i class="fas fa-check-square"></i>
                        </button>
                        <button class="sww-layer-action-btn" onclick="swwInstance.clearSelection()" title="Clear Selection">
                            <i class="far fa-square"></i>
                        </button>
                        <button class="sww-layer-action-btn" onclick="swwInstance.copySelected(); swwInstance.pasteClipboard();" title="Duplicate">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="sww-layer-action-btn" onclick="swwInstance.deleteSelectedElements()" title="Delete Selected">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                
                <div class="sww-layers-container" id="sww-layers-list">
                    <div id="no-layers-message" class="sww-info-text" style="text-align: center; padding: 20px;">
                        No elements in the scene.<br>
                        Add elements using the tools to see them here.
                    </div>
                </div>
            </div>
            
            <!-- Customize Section -->
            <div id="sww-customize-section" class="sww-control-section" style="display: none;">
                <div style="padding: 20px; text-align: center; color: #ffffff80;">
                    No elements selected. Select an element to customize its properties.
                </div>
            </div>

        </div>

        <!-- Main Canvas Area -->
        <div class="sww-canvas-area" id="sww-drawing-canvas"></div>
        
    </div>

    <!-- Bottom Toolbar -->
    <div class="sww-toolbar-container">
        
        <!-- Zoom Controls -->
        <div id="sww-zoom" class="sww-toolbar-action">
            <button class="sww-toolbar-button" onclick="swwInstance.zoomIn()" title="Zoom In" id="zoom-in-btn">
                <i class="fas fa-search-plus"></i>
            </button>
            <button class="sww-toolbar-button" onclick="swwInstance.zoomOut()" title="Zoom Out" id="zoom-out-btn">
                <i class="fas fa-search-minus"></i>
            </button>
        </div>
        
        <!-- Action Controls -->
        <div id="sww-action" class="sww-toolbar-action">
            <button class="sww-toolbar-button" onclick="swwInstance.undo()" title="Undo" id="undo-btn">
                <i class="fas fa-undo"></i>
            </button>
            <button class="sww-toolbar-button" onclick="swwInstance.redo()" title="Redo" id="redo-btn">
                <i class="fas fa-redo"></i>
            </button>
            <!-- <button class="sww-toolbar-button" title="Save">
                <i class="fas fa-save"></i>
            </button> -->
            <button class="sww-toolbar-button" onclick="swwInstance.togglePreviewMode()" title="Preview" id="toggle-preview-btn">
                <i class="far fa-window-maximize"></i>
            </button>
            <button class="sww-toolbar-button" onclick="swwInstance.selectAll()" title="Select All" id="select-all-btn">
                <i class="fas fa-check-double"></i>
            </button>
            <button class="sww-toolbar-button" onclick="swwInstance.clearAll()" title="Clear Canvas" id="clear-canvas-btn">
                <i class="fas fa-eraser"></i>
            </button>
        </div>
        
        <!-- Menu Controls -->
        <div id="sww-menu" class="sww-toolbar-action">
            <!-- <button class="sww-toolbar-button" onclick="exportSVG()" title="Export SVG">
                <i class="fas fa-download"></i>
            </button> -->
            <button class="sww-toolbar-button" onclick="swwInstance.toggleGrid()" title="Toggle Grid" id="toggle-grid-btn">
                <i class="fas fa-border-none"></i>
            </button>
        </div>
        
    </div>

    <!-- Application Logic -->
    <script>
        // Global variables
        let swwInstance;
        let swwControlPanel;

        /**
         * Initialize the application when DOM is ready
         */
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("sww-drawing-canvas");

            // Initialize SWW drawing library
            swwInstance = sww.init(container, {
                backgroundColor: "#ffffff",
                gridSize: 20,
                showGrid: true,
                readOnly: false, // default false
            });

            // Initialize control panel
            swwControlPanel = new SWWControlPanel(swwInstance);
            
            // Make control panel globally accessible
            window.swwControlPanel = swwControlPanel;
            
            // Trigger initial layer update
            swwControlPanel.updateLayers();
            
            // Setup menu navigation
            setupMenuNavigation();

            console.log("SenangWebs Whiteboard initialized successfully!");
        });
        
        /**
         * Setup menu navigation for control panel
         */
        function setupMenuNavigation() {
            const menuButtons = document.querySelectorAll('.sww-control-menu-button');
            const sections = document.querySelectorAll('.sww-control-section');
            
            menuButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetMenu = button.getAttribute('data-menu');
                    
                    // Update active button
                    menuButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // Show/hide sections
                    sections.forEach(section => {
                        section.style.display = 'none';
                    });
                    
                    const targetSection = document.getElementById(`sww-${targetMenu}-section`);
                    if (targetSection) {
                        targetSection.style.display = 'block';
                        
                        // If switching to layers, update the layer list
                        if (targetMenu === 'layers' && window.swwControlPanel) {
                            window.swwControlPanel.updateLayers();
                        }
                    }
                });
            });
        }

        /**
         * Toggle panel width between normal and expanded
         */
        function togglePanelWidth() {
            const controlPanel = document.getElementById('sww-control-panel');
            controlPanel.classList.toggle('expanded');
            const toggleWidthBtn = document.getElementById('toggle-width-btn');
            if (controlPanel.classList.contains('expanded')) {
                toggleWidthBtn.title = "Collapse Panel Width";
                toggleWidthBtn.classList.add('active');
            } else {
                toggleWidthBtn.title = "Expand Panel Width";
                toggleWidthBtn.classList.remove('active');
            }
        }

        /**
         * Toggle panel docking between docked and undocked
         */
        function togglePanelDock() {
            const controlPanel = document.getElementById('sww-control-panel');
            controlPanel.classList.toggle('undocked');
            const toggleDockBtn = document.getElementById('toggle-dock-btn');
            if (controlPanel.classList.contains('undocked')) {
                toggleDockBtn.title = "Dock Panel";
                toggleDockBtn.classList.remove('active');
            } else {
                toggleDockBtn.title = "Undock Panel";
                toggleDockBtn.classList.add('active');
            }
        }
    </script>
</body>
</html>
