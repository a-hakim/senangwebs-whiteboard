<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SenangWebs Whiteboard - Tailwind UI</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#eff6ff",
                100: "#dbeafe",
                200: "#bfdbfe",
                300: "#93c5fd",
                400: "#60a5fa",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
                800: "#1e40af",
                900: "#1e3a8a",
              },
              secondary: {
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
              },
              light: {
                bg: "#f8fafc",
                panel: "#ffffff",
              },
            },
          },
        },
      };
    </script>

    <!-- SWW Library Files (with built-in SenangStart Icons and Marked) -->
    <link rel="stylesheet" href="../dist/sww.min.css" />
    <script src="../dist/sww.min.js"></script>

    <style>
      .palette-minimized {
        transform: translateX(-240px);
      }

      /* Preview mode styles */
      .preview-mode {
        background: #1e3a8a !important;
        cursor: pointer;
      }

      .preview-mode #sww-drawing-canvas {
        background: white;
        border-radius: 8px;
        box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.2),
          0 10px 10px -5px rgba(59, 130, 246, 0.1);
      }

      #exitPreviewHint {
        animation: slideInFromTop 0.3s ease-out;
      }

      @keyframes slideInFromTop {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* Smooth transitions for UI elements */
      header,
      #toolPalette,
      .fixed.bottom-5 {
        transition: all 0.3s ease;
      }

      /* Light theme enhancements */
      .bg-light-bg {
        background-color: #f8fafc;
      }

      .bg-light-panel {
        background-color: #ffffff;
      }

      /* Scrollbar styling for light theme */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }

      ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #2563eb;
      }

      /* Focus states for accessibility */
      button:focus {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }

      /* Glowing effect for primary buttons */
      .glow-primary {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      }

      .sww-properties-panel {
        border-left: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body class="font-sans h-screen overflow-hidden bg-light-bg">
    <!-- Main Container -->
    <div class="flex flex-col h-screen bg-light-panel">
      <!-- Top Header -->
      <header
        class="bg-primary-600 text-white px-5 py-3 flex justify-between items-center shadow-lg z-50"
      >
        <h1 class="text-xl font-semibold flex items-center gap-2.5">
          SenangWebs Whiteboard
        </h1>
        <div class="flex gap-2">
          <button
            onclick="toggleFullscreen()"
            class="bg-white/10 hover:bg-white/20 border border-white/20 hover:border-white/30 text-white px-3 py-2 rounded-md text-sm transition-all duration-200 flex items-center gap-1.5 hover:-translate-y-0.5"
            title="Fullscreen"
          >
            <ss-icon icon="maximize" thickness="2.2" class="text-lg"></ss-icon>
          </button>
          <button
            onclick="togglePreview()"
            class="bg-white/10 hover:bg-white/20 border border-white/20 hover:border-white/30 text-white px-3 py-2 rounded-md text-sm transition-all duration-200 flex items-center gap-1.5 hover:-translate-y-0.5"
            title="Preview Mode"
          >
            <ss-icon icon="eye" thickness="2.2" class="text-lg"></ss-icon>
          </button>
          <button
            onclick="exportCanvas()"
            class="bg-white/10 hover:bg-white/20 border border-white/20 hover:border-white/30 text-white px-3 py-2 rounded-md text-sm transition-all duration-200 flex items-center gap-1.5 hover:-translate-y-0.5"
            title="Export"
          >
            <ss-icon icon="save" thickness="2.2" class="text-lg"></ss-icon>
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <div class="flex flex-1 relative">
        <!-- Floating Tool Palette -->
        <div
          id="toolPalette"
          class="absolute top-5 left-5 bg-white border border-slate-200 rounded-xl shadow-xl p-4 z-40 min-w-[280px] max-w-[280px] transition-all duration-300"
        >
          <div
            class="flex justify-between items-center mb-4 pb-3 border-b border-slate-200"
          >
            <span class="font-semibold text-slate-800 text-base">Tools</span>
            <button
              onclick="togglePalette()"
              class="bg-transparent border-0 p-1 rounded text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600 flex items-center"
              title="Toggle Palette"
            >
              <div id="paletteToggleIcon" class="flex items-center">
                <ss-icon icon="chevron-left" thickness="2.2"></ss-icon>
              </div>
            </button>
          </div>

          <!-- Tool Tabs -->
          <div id="toolsTab" class="flex mb-4 bg-slate-50 rounded-lg p-1">
            <button
              onclick="switchTab('tools')"
              data-tab="tools"
              class="flex-1 bg-primary-500 text-white shadow-sm border-0 px-3 py-2 rounded-md text-xs font-medium transition-all duration-200 flex items-center justify-center gap-1.5"
            >
              <ss-icon icon="layout" thickness="2.2" class="text-lg"></ss-icon>
              <span>Tools</span>
            </button>
            <button
              onclick="switchTab('layers')"
              data-tab="layers"
              class="flex-1 bg-transparent text-slate-600 border-0 px-3 py-2 rounded-md text-xs font-medium transition-all duration-200 flex items-center justify-center gap-1.5 hover:bg-slate-100 hover:text-primary-600"
            >
              <ss-icon
                icon="layer-stacks"
                thickness="2.2"
                class="text-lg"
              ></ss-icon>
              <span>Layers</span>
            </button>
          </div>

          <!-- Tools Grid -->
          <div id="toolsGrid" class="grid grid-cols-2 gap-2">
            <button
              onclick="selectTool('select')"
              data-tool="select"
              class="bg-primary-50 border-2 border-primary-500 text-primary-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:-translate-y-0.5"
            >
              <ss-icon icon="cursor" thickness="2.2" class="text-4xl"></ss-icon>
              <span>Select</span>
            </button>
            <button
              onclick="selectTool('rectangle')"
              data-tool="rectangle"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon icon="square" thickness="2.2" class="text-4xl"></ss-icon>
              <span>Rectangle</span>
            </button>
            <button
              onclick="selectTool('ellipse')"
              data-tool="ellipse"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon icon="circle" thickness="2.2" class="text-4xl"></ss-icon>
              <span>Circle</span>
            </button>
            <button
              onclick="selectTool('diamond')"
              data-tool="diamond"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon
                icon="diamond"
                thickness="2.2"
                class="text-4xl"
              ></ss-icon>
              <span>Diamond</span>
            </button>
            <button
              onclick="selectTool('star')"
              data-tool="star"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon icon="star" thickness="2.2" class="text-4xl"></ss-icon>
              <span>Star</span>
            </button>
            <button
              onclick="selectTool('draw')"
              data-tool="draw"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon
                icon="draw-curve"
                thickness="2.2"
                class="text-4xl"
              ></ss-icon>
              <span>Draw</span>
            </button>
            <button
              onclick="selectTool('line')"
              data-tool="line"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon
                icon="draw-line"
                thickness="2.2"
                class="text-4xl"
              ></ss-icon>
              <span>Line</span>
            </button>
            <button
              onclick="selectTool('arrow')"
              data-tool="arrow"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon
                icon="arrow-right"
                thickness="2.2"
                class="text-4xl"
              ></ss-icon>
              <span>Arrow</span>
            </button>
            <button
              onclick="selectTool('text')"
              data-tool="text"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon icon="text" thickness="2.2" class="text-4xl"></ss-icon>
              <span>Text</span>
            </button>
            <button
              onclick="selectTool('image')"
              data-tool="image"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon icon="photo" thickness="2.2" class="text-4xl"></ss-icon>
              <span>Image</span>
            </button>
            <button
              onclick="selectTool('website')"
              data-tool="website"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon
                icon="globe-alt"
                thickness="2.2"
                class="text-4xl"
              ></ss-icon>
              <span>Website</span>
            </button>
            <button
              onclick="selectTool('markdown')"
              data-tool="markdown"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon
                icon="document-text"
                thickness="2.2"
                class="text-4xl"
              ></ss-icon>
              <span>Document</span>
            </button>
            <button
              onclick="selectTool('table')"
              data-tool="table"
              class="bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5"
            >
              <ss-icon
                icon="table"
                thickness="2.2"
                class="text-4xl"
              ></ss-icon>
              <span>Table</span>
            </button>
          </div>

          <!-- Layers List -->
          <div id="layersContent" class="hidden">
            <div class="max-h-96 overflow-y-auto">
              <div id="layersContainer">
                <div class="text-center py-5 text-slate-500">
                  No elements in the scene.<br />
                  <small>Add elements to see them here.</small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Canvas Container -->
        <div
          id="canvasContainer"
          class="flex-1 relative bg-white overflow-hidden"
        >
          <div id="sww-drawing-canvas"></div>
        </div>
      </div>

      <!-- Bottom Floating Action Bar -->
      <div
        class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-white border border-slate-200 rounded-xl shadow-xl px-5 py-3 flex gap-4 z-40"
      >
        <div class="flex gap-2 items-center">
          <button
            onclick="swwInstance.undo()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Undo (Ctrl+Z)"
          >
            <ss-icon
              icon="arrow-rotate-ccw"
              thickness="2.2"
              class="text-2xl"
            ></ss-icon>
          </button>
          <button
            onclick="swwInstance.redo()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Redo (Ctrl+Y)"
          >
            <ss-icon
              icon="arrow-rotate-cw"
              thickness="2.2"
              class="text-2xl"
            ></ss-icon>
          </button>
        </div>

        <div class="flex gap-2 items-center border-r border-slate-200 pr-4">
          <button
            onclick="swwInstance.zoomIn()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Zoom In"
          >
            <ss-icon
              icon="magnifying-glass-plus"
              thickness="2.2"
              class="text-2xl"
            ></ss-icon>
          </button>
          <button
            onclick="swwInstance.zoomOut()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Zoom Out"
          >
            <ss-icon
              icon="magnifying-glass-minus"
              thickness="2.2"
              class="text-2xl"
            ></ss-icon>
          </button>
          <button
            onclick="swwInstance.resetZoom()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Reset Zoom"
          >
            <ss-icon icon="minimize" thickness="2.2" class="text-2xl"></ss-icon>
          </button>
        </div>

        <div class="flex gap-2 items-center border-r border-slate-200 pr-4">
          <button
            onclick="swwInstance.selectAll()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Select All"
          >
            <ss-icon
              icon="double-tick"
              thickness="2.2"
              class="text-2xl"
            ></ss-icon>
          </button>
          <button
            onclick="swwInstance.clearSelection()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Clear Selection"
          >
            <ss-icon icon="x-mark" thickness="2.2" class="text-2xl"></ss-icon>
          </button>
          <button
            onclick="copyPaste()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Duplicate"
          >
            <ss-icon
              icon="document-duplicate"
              thickness="2.2"
              class="text-2xl"
            ></ss-icon>
          </button>
          <button
            onclick="swwInstance.deleteSelectedElements()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-red-500"
            title="Delete"
          >
            <ss-icon icon="trash" thickness="2.2" class="text-2xl"></ss-icon>
          </button>
        </div>

        <div class="flex gap-2 items-center">
          <button
            onclick="swwInstance.toggleGrid()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-primary-600"
            title="Toggle Grid"
          >
            <ss-icon icon="grid" thickness="2.2" class="text-2xl"></ss-icon>
          </button>
          <button
            onclick="swwInstance.clearAll()"
            class="bg-transparent border-0 p-2 rounded-md text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-red-500"
            title="Clear All"
          >
            <ss-icon icon="eraser" thickness="2.2" class="text-2xl"></ss-icon>
          </button>
        </div>
      </div>
    </div>

    <script>
      let swwInstance,
        currentTab = "tools",
        paletteMinimized = false;

      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("sww-drawing-canvas");
        swwInstance = sww.init(container, {
          backgroundColor: "#ffffff",
          gridSize: 20,
          showGrid: true,
          readOnly: false,
          panelMode: "light", // Start with light mode
          panelBackgroundColor: "#ffffff",
          panelTextColor: "#000000",
          accentColor: "#3b82f6",
          secondaryAccentColor: "#2563eb",
        });
        window.swwInstance = swwInstance;
        swwInstance.controlPanel = { updateLayers: updateLayersList };
        container.addEventListener("sww:sceneChanged", updateLayersList);
        container.addEventListener("sww:selectionChanged", updateLayersList);

        setupKeyboardShortcuts();
        setupEventListeners();
        updateLayersList();
        console.log("SenangWebs Whiteboard (Tailwind UI) initialized!");
      });

      function switchTab(tabName) {
        currentTab = tabName;
        document.querySelectorAll("[data-tab]").forEach((btn) => {
          btn.className =
            btn.dataset.tab === tabName
              ? "flex-1 bg-primary-500 text-white shadow-sm border-0 px-3 py-2 rounded-md text-xs font-medium transition-all duration-200 flex items-center justify-center gap-1.5"
              : "flex-1 bg-transparent text-slate-600 border-0 px-3 py-2 rounded-md text-xs font-medium transition-all duration-200 flex items-center justify-center gap-1.5 hover:bg-slate-100 hover:text-primary-600";
        });

        if (tabName === "tools") {
          document.getElementById("toolsGrid").classList.remove("hidden");
          document.getElementById("layersContent").classList.add("hidden");
        } else {
          document.getElementById("toolsGrid").classList.add("hidden");
          document.getElementById("layersContent").classList.remove("hidden");
          updateLayersList();
        }
      }

      function selectTool(toolName) {
        document.querySelectorAll("[data-tool]").forEach((btn) => {
          btn.className =
            btn.dataset.tool === toolName
              ? "bg-primary-50 border-2 border-primary-500 text-primary-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:-translate-y-0.5"
              : "bg-slate-50 border-2 border-slate-200 text-slate-700 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-primary-50 hover:text-primary-700 hover:-translate-y-0.5";
        });
        swwInstance.setTool(toolName);
      }

      function togglePalette() {
        const palette = document.getElementById("toolPalette");
        const canvas = document.getElementById("canvasContainer");
        const icon = document.getElementById("paletteToggleIcon");

        paletteMinimized = !paletteMinimized;
        if (paletteMinimized) {
          palette.classList.add("palette-minimized");
          canvas.classList.add("canvas-full-width");
          icon.innerHTML =
            "<ss-icon icon='chevron-right' thickness='2.2'></ss-icon>";
        } else {
          palette.classList.remove("palette-minimized");
          canvas.classList.remove("canvas-full-width");
          icon.innerHTML =
            "<ss-icon icon='chevron-left' thickness='2.2'></ss-icon>";
        }
      }

      function updateLayersList() {
        const container = document.getElementById("layersContainer");
        if (!container || !swwInstance?.elements) {
          container.innerHTML =
            '<div class="text-center py-5 text-slate-500">No elements in the scene.<br><small>Add elements to see them here.</small></div>';
          return;
        }

        const elements = swwInstance.elements;
        if (!Array.isArray(elements) || elements.length === 0) {
          container.innerHTML =
            '<div class="text-center py-5 text-slate-500">No elements in the scene.<br><small>Add elements to see them here.</small></div>';
          return;
        }

        const selectedElements = swwInstance.selectedElements || new Set();
        container.innerHTML = elements
          .map((element, index) => {
            if (!element?.id || !element?.type) return "";
            const isSelected = selectedElements.has?.(element.id);
            const selectedClass = isSelected
              ? "border-primary-500 bg-primary-50"
              : "border-slate-200 bg-slate-50";

            return `
                    <div class="transition-all duration-200 flex justify-between items-center p-3 mb-2 rounded-md border cursor-pointer ${selectedClass} hover:border-primary-500 hover:bg-primary-50" 
                         onclick="selectElement('${element.id}')">
                        <div class="flex items-center gap-2">
                            <i class="ss ss-${getElementIcon(
                              element.type
                            )} text-sm ${
              isSelected ? "text-primary-600" : "text-slate-600"
            }"></i>
                            <span class="text-sm font-medium ${
                              isSelected ? "text-primary-700" : "text-slate-700"
                            }">${element.type} ${index + 1}</span>
                        </div>
                        <div class="flex gap-2">
                            <button class="bg-transparent border-0 rounded text-slate-500 text-sm hover:bg-slate-100 flex items-center justify-center hover:text-primary-600" 
                                    onclick="event.stopPropagation(); toggleElementVisibility('${
                                      element.id
                                    }')" title="Toggle Visibility">
                                <i class="ss ss-${
                                  element.hidden ? "eye-slash" : "eye"
                                }"></i>
                            </button>
                            <button class="bg-transparent border-0 rounded text-slate-500 text-sm hover:bg-slate-100 flex items-center justify-center hover:text-red-500" 
                                    onclick="event.stopPropagation(); deleteElement('${
                                      element.id
                                    }')" title="Delete">
                                <i class="ss ss-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
          })
          .filter((html) => html)
          .join("");
      }

      function getElementIcon(type) {
        const icons = {
          rectangle: "square",
          ellipse: "circle",
          diamond: "diamond",
          star: "star",
          line: "draw-line",
          path: "draw-curve",
          arrow: "arrow-right",
          text: "text",
          image: "photo",
          website: "globe-alt",
          markdown: "document-text",
        };
        return icons[type] || "shapes";
      }

      function selectElement(elementId) {
        if (swwInstance?.selectElementById) {
          const success = swwInstance.selectElementById(elementId);
          if (success) {
            updateLayersList();
          }
        }
      }

      function toggleElementVisibility(elementId) {
        if (swwInstance?.toggleElementVisibility) {
          const success = swwInstance.toggleElementVisibility(elementId);
          if (success) {
            updateLayersList();
          }
        }
      }

      function deleteElement(elementId) {
        if (swwInstance?.deleteElementById) {
          const success = swwInstance.deleteElementById(elementId);
          if (success) {
            updateLayersList();
          }
        }
      }

      function copyPaste() {
        swwInstance?.copySelected?.();
        swwInstance?.pasteClipboard?.();
      }

      let isPreviewMode = false;

      function togglePreview() {
        isPreviewMode = !isPreviewMode;
        // Also call the SWW library's preview mode if available
        swwInstance?.togglePreviewMode?.();
      }

      function handlePreviewEscape(e) {
        if (e.key === "Escape" && isPreviewMode) {
          togglePreview();
        }
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement
            .requestFullscreen()
            .catch((err) => console.log("Fullscreen not available:", err));
        } else {
          document
            .exitFullscreen()
            .catch((err) => console.log("Exit fullscreen failed:", err));
        }
      }

      function exportCanvas() {
        alert(
          "Export functionality can be implemented based on your needs (SVG, PNG, JSON, etc.)"
        );
      }

      function setupKeyboardShortcuts() {
        document.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")
            return;

          if (e.ctrlKey || e.metaKey) {
            switch (e.key) {
              case "z":
                e.preventDefault();
                e.shiftKey ? swwInstance.redo() : swwInstance.undo();
                break;
              case "y":
                e.preventDefault();
                swwInstance.redo();
                break;
              case "a":
                e.preventDefault();
                swwInstance.selectAll();
                break;
              case "c":
                e.preventDefault();
                swwInstance.copySelected();
                break;
              case "v":
                e.preventDefault();
                swwInstance.pasteClipboard();
                break;
              case "d":
                e.preventDefault();
                copyPaste();
                break;
            }
          } else {
            switch (e.key) {
              case "Delete":
              case "Backspace":
                e.preventDefault();
                swwInstance.deleteSelectedElements();
                break;
              case "Escape":
                swwInstance.clearSelection();
                break;
              case "1":
                selectTool("select");
                break;
              case "2":
                selectTool("rectangle");
                break;
              case "3":
                selectTool("ellipse");
                break;
              case "4":
                selectTool("arrow");
                break;
              case "5":
                selectTool("text");
                break;
            }
          }
        });
      }

      function setupEventListeners() {
        const canvas = swwInstance?.canvas;
        if (canvas) {
          canvas.addEventListener("mouseup", () =>
            setTimeout(updateLayersList, 100)
          );
          document.addEventListener("keyup", (e) => {
            if (e.key === "Delete" || e.key === "Backspace")
              setTimeout(updateLayersList, 100);
          });
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.altKey && e.key === "h") {
          alert(
            "Keyboard Shortcuts:\n\nTools:\n1 - Select\n2 - Rectangle\n3 - Circle\n4 - Arrow\n5 - Text\n\nActions:\nCtrl+Z - Undo\nCtrl+Y - Redo\nCtrl+A - Select All\nCtrl+C - Copy\nCtrl+V - Paste\nCtrl+D - Duplicate\nDelete - Delete Selected\nEscape - Clear Selection\n\nAlt+H - Show this help"
          );
        }
      });
    </script>
  </body>
</html>
