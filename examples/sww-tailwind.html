<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SenangWebs Whiteboard - Tailwind UI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            500: '#4f46e5',
                            600: '#4338ca',
                            700: '#3730a3'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- SWW Library Files (with built-in FontAwesome and Marked) -->
    <link rel="stylesheet" href="../dist/sww.css" />
    <script src="../dist/sww.js"></script>
    
    <style>
        .palette-minimized { transform: translateX(-240px); }
        .canvas-full-width { margin-left: 1.25rem !important; }
    </style>
</head>
<body class="font-sans h-screen overflow-hidden bg-gradient-to-br from-blue-400 via-purple-500 to-purple-600">
    <!-- Main Container -->
    <div class="flex flex-col h-screen bg-slate-50">
        
        <!-- Top Header -->
        <header class="bg-gradient-to-r from-primary-500 to-purple-500 text-white px-5 py-3 flex justify-between items-center shadow-lg z-50">
            <h1 class="text-xl font-semibold flex items-center gap-2.5">
                <i class="fas fa-palette"></i>
                SenangWebs Whiteboard
            </h1>
            <div class="flex gap-2">
                <button onclick="toggleFullscreen()" 
                        class="bg-white/20 hover:bg-white/30 border-0 text-white px-3 py-2 rounded-md text-sm transition-all duration-200 flex items-center gap-1.5 hover:-translate-y-0.5"
                        title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
                <button onclick="togglePreview()" 
                        class="bg-white/20 hover:bg-white/30 border-0 text-white px-3 py-2 rounded-md text-sm transition-all duration-200 flex items-center gap-1.5 hover:-translate-y-0.5"
                        title="Preview Mode">
                    <i class="fas fa-eye"></i>
                </button>
                <button onclick="exportCanvas()" 
                        class="bg-white/20 hover:bg-white/30 border-0 text-white px-3 py-2 rounded-md text-sm transition-all duration-200 flex items-center gap-1.5 hover:-translate-y-0.5"
                        title="Export">
                    <i class="fas fa-download"></i>
                </button>
            </div>
        </header>
        
        <!-- Main Content -->
        <div class="flex flex-1 relative">
            
            <!-- Floating Tool Palette -->
            <div id="toolPalette" class="absolute top-5 left-5 bg-white rounded-xl shadow-xl p-4 z-40 max-w-[280px] transition-all duration-300">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
                    <span class="font-semibold text-slate-800 text-base">Tools</span>
                    <button onclick="togglePalette()" 
                            class="bg-transparent border-0 p-1 rounded text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                            title="Toggle Palette">
                        <i id="paletteToggleIcon" class="fas fa-chevron-left"></i>
                    </button>
                </div>
                
                <!-- Tool Tabs -->
                <div class="flex mb-4 bg-slate-50 rounded-lg p-1">
                    <button onclick="switchTab('tools')" 
                            data-tab="tools"
                            class="flex-1 bg-white text-primary-500 shadow-sm border-0 px-3 py-2 rounded-md text-xs font-medium transition-all duration-200 flex items-center justify-center gap-1.5">
                        <i class="fas fa-tools"></i>
                        <span>Tools</span>
                    </button>
                    <button onclick="switchTab('layers')" 
                            data-tab="layers"
                            class="flex-1 bg-transparent text-slate-500 border-0 px-3 py-2 rounded-md text-xs font-medium transition-all duration-200 flex items-center justify-center gap-1.5 hover:bg-white hover:text-primary-500 hover:shadow-sm">
                        <i class="fas fa-layer-group"></i>
                        <span>Layers</span>
                    </button>
                </div>
                
                <!-- Tools Grid -->
                <div id="toolsGrid" class="grid grid-cols-2 gap-2 mb-4">
                    <button onclick="selectTool('select')" data-tool="select"
                            class="bg-primary-50 border-2 border-primary-500 text-primary-500 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:-translate-y-0.5">
                        <i class="fas fa-mouse-pointer text-lg"></i>
                        <span>Select</span>
                    </button>
                    <button onclick="selectTool('rectangle')" data-tool="rectangle"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="far fa-square text-lg"></i>
                        <span>Rectangle</span>
                    </button>
                    <button onclick="selectTool('ellipse')" data-tool="ellipse"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="far fa-circle text-lg"></i>
                        <span>Circle</span>
                    </button>
                    <button onclick="selectTool('diamond')" data-tool="diamond"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="far fa-gem text-lg"></i>
                        <span>Diamond</span>
                    </button>
                    <button onclick="selectTool('star')" data-tool="star"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="far fa-star text-lg"></i>
                        <span>Star</span>
                    </button>
                    <button onclick="selectTool('arrow')" data-tool="arrow"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="fas fa-arrow-right text-lg"></i>
                        <span>Arrow</span>
                    </button>
                    <button onclick="selectTool('text')" data-tool="text"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="fas fa-font text-lg"></i>
                        <span>Text</span>
                    </button>
                    <button onclick="selectTool('image')" data-tool="image"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="fas fa-image text-lg"></i>
                        <span>Image</span>
                    </button>
                    <button onclick="selectTool('website')" data-tool="website"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="fas fa-globe text-lg"></i>
                        <span>Website</span>
                    </button>
                    <button onclick="selectTool('markdown')" data-tool="markdown"
                            class="bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5">
                        <i class="fab fa-markdown text-lg"></i>
                        <span>Document</span>
                    </button>
                </div>
                
                <!-- Layers List -->
                <div id="layersContent" class="hidden">
                    <div class="max-h-96 overflow-y-auto">
                        <div id="layersContainer">
                            <div class="text-center py-5 text-slate-500">
                                No elements in the scene.<br>
                                <small>Add elements to see them here.</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Canvas Container -->
            <div id="canvasContainer" class="flex-1 relative bg-white m-5 ml-80 rounded-xl shadow-lg overflow-hidden">
                <div id="sww-drawing-canvas"></div>
            </div>
            
        </div>
        
        <!-- Bottom Floating Action Bar -->
        <div class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-white rounded-xl shadow-xl px-5 py-3 flex gap-4 z-40">
            <div class="flex gap-2 items-center">
                <button onclick="swwInstance.undo()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Undo (Ctrl+Z)">
                    <i class="fas fa-undo"></i>
                </button>
                <button onclick="swwInstance.redo()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Redo (Ctrl+Y)">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            
            <div class="flex gap-2 items-center border-r border-slate-200 pr-4">
                <button onclick="swwInstance.zoomIn()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Zoom In">
                    <i class="fas fa-search-plus"></i>
                </button>
                <button onclick="swwInstance.zoomOut()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Zoom Out">
                    <i class="fas fa-search-minus"></i>
                </button>
                <button onclick="swwInstance.resetZoom()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Reset Zoom">
                    <i class="fas fa-compress-arrows-alt"></i>
                </button>
            </div>
            
            <div class="flex gap-2 items-center border-r border-slate-200 pr-4">
                <button onclick="swwInstance.selectAll()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Select All">
                    <i class="fas fa-check-double"></i>
                </button>
                <button onclick="swwInstance.clearSelection()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Clear Selection">
                    <i class="fas fa-times"></i>
                </button>
                <button onclick="copyPaste()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Duplicate">
                    <i class="fas fa-copy"></i>
                </button>
                <button onclick="swwInstance.deleteSelectedElements()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Delete">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
            
            <div class="flex gap-2 items-center">
                <button onclick="swwInstance.toggleGrid()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Toggle Grid">
                    <i class="fas fa-border-all"></i>
                </button>
                <button onclick="swwInstance.clearAll()" 
                        class="bg-transparent border-0 p-2 rounded-md text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-slate-700"
                        title="Clear All">
                    <i class="fas fa-eraser"></i>
                </button>
            </div>
        </div>
        
    </div>

    <script>
        let swwInstance, currentTab = 'tools', paletteMinimized = false;

        document.addEventListener("DOMContentLoaded", () => {
            swwInstance = sww.init(document.getElementById("sww-drawing-canvas"), {
                backgroundColor: "#ffffff", gridSize: 20, showGrid: true, readOnly: false
            });
            window.swwInstance = swwInstance;
            setupKeyboardShortcuts();
            setupEventListeners();
            updateLayersList();
            console.log("SenangWebs Whiteboard (Tailwind UI) initialized!");
        });

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('[data-tab]').forEach(btn => {
                btn.className = btn.dataset.tab === tabName ? 
                    "flex-1 bg-white text-primary-500 shadow-sm border-0 px-3 py-2 rounded-md text-xs font-medium transition-all duration-200 flex items-center justify-center gap-1.5" :
                    "flex-1 bg-transparent text-slate-500 border-0 px-3 py-2 rounded-md text-xs font-medium transition-all duration-200 flex items-center justify-center gap-1.5 hover:bg-white hover:text-primary-500 hover:shadow-sm";
            });
            
            if (tabName === 'tools') {
                document.getElementById('toolsGrid').classList.remove('hidden');
                document.getElementById('layersContent').classList.add('hidden');
            } else {
                document.getElementById('toolsGrid').classList.add('hidden');
                document.getElementById('layersContent').classList.remove('hidden');
                updateLayersList();
            }
        }

        function selectTool(toolName) {
            document.querySelectorAll('[data-tool]').forEach(btn => {
                btn.className = btn.dataset.tool === toolName ?
                    "bg-primary-50 border-2 border-primary-500 text-primary-500 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:-translate-y-0.5" :
                    "bg-white border-2 border-slate-200 text-slate-600 p-3 rounded-lg transition-all duration-200 flex flex-col items-center gap-1.5 text-xs font-medium hover:border-primary-500 hover:bg-slate-50 hover:-translate-y-0.5";
            });
            swwInstance.setTool(toolName);
        }

        function togglePalette() {
            const palette = document.getElementById('toolPalette');
            const canvas = document.getElementById('canvasContainer');
            const icon = document.getElementById('paletteToggleIcon');
            
            paletteMinimized = !paletteMinimized;
            if (paletteMinimized) {
                palette.classList.add('palette-minimized');
                canvas.classList.add('canvas-full-width');
                icon.className = 'fas fa-chevron-right';
            } else {
                palette.classList.remove('palette-minimized');
                canvas.classList.remove('canvas-full-width');
                icon.className = 'fas fa-chevron-left';
            }
        }

        function updateLayersList() {
            const container = document.getElementById('layersContainer');
            if (!container || !swwInstance?.elements) {
                container.innerHTML = '<div class="text-center py-5 text-slate-500">No elements in the scene.<br><small>Add elements to see them here.</small></div>';
                return;
            }

            const elements = swwInstance.elements;
            if (!Array.isArray(elements) || elements.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-slate-500">No elements in the scene.<br><small>Add elements to see them here.</small></div>';
                return;
            }

            const selectedElements = swwInstance.selectedElements || new Set();
            container.innerHTML = elements.map((element, index) => {
                if (!element?.id || !element?.type) return '';
                const isSelected = selectedElements.has?.(element.id);
                const selectedClass = isSelected ? 'border-primary-500 bg-primary-50' : 'border-slate-200 bg-slate-50';
                
                return `
                    <div class="transition-all duration-200 flex justify-between items-center p-3 mb-2 rounded-md border cursor-pointer ${selectedClass} hover:border-primary-500 hover:bg-slate-100" 
                         onclick="selectElement('${element.id}')">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-${getElementIcon(element.type)} text-sm"></i>
                            <span class="text-sm font-medium">${element.type} ${index + 1}</span>
                        </div>
                        <div class="flex gap-1">
                            <button class="bg-transparent border-0 p-1 rounded text-slate-500 text-xs hover:bg-primary-100 hover:text-primary-500" 
                                    onclick="event.stopPropagation(); toggleElementVisibility('${element.id}')" title="Toggle Visibility">
                                <i class="fas fa-${element.hidden ? 'eye-slash' : 'eye'}"></i>
                            </button>
                            <button class="bg-transparent border-0 p-1 rounded text-slate-500 text-xs hover:bg-red-100 hover:text-red-500" 
                                    onclick="event.stopPropagation(); deleteElement('${element.id}')" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).filter(html => html).join('');
        }

        function getElementIcon(type) {
            const icons = { rectangle: 'square', ellipse: 'circle', diamond: 'gem', star: 'star', arrow: 'arrow-right', text: 'font', image: 'image', website: 'globe', markdown: 'file-alt' };
            return icons[type] || 'shapes';
        }

        function selectElement(elementId) {
            if (swwInstance?.clearSelection && swwInstance?.selectElement) {
                swwInstance.clearSelection();
                swwInstance.selectElement(elementId);
                updateLayersList();
            }
        }

        function toggleElementVisibility(elementId) {
            const element = swwInstance?.getElementById?.(elementId);
            if (element) {
                element.hidden = !element.hidden;
                swwInstance.render?.();
                updateLayersList();
            }
        }

        function deleteElement(elementId) {
            if (swwInstance?.selectElement && swwInstance?.deleteSelectedElements) {
                swwInstance.selectElement(elementId);
                swwInstance.deleteSelectedElements();
                updateLayersList();
            }
        }

        function copyPaste() {
            swwInstance?.copySelected?.();
            swwInstance?.pasteClipboard?.();
        }

        function togglePreview() { swwInstance?.togglePreviewMode?.(); }
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log('Fullscreen not available:', err));
            } else {
                document.exitFullscreen().catch(err => console.log('Exit fullscreen failed:', err));
            }
        }
        function exportCanvas() { alert('Export functionality can be implemented based on your needs (SVG, PNG, JSON, etc.)'); }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                if (e.ctrlKey || e.metaKey) {
                    switch (e.key) {
                        case 'z': e.preventDefault(); e.shiftKey ? swwInstance.redo() : swwInstance.undo(); break;
                        case 'y': e.preventDefault(); swwInstance.redo(); break;
                        case 'a': e.preventDefault(); swwInstance.selectAll(); break;
                        case 'c': e.preventDefault(); swwInstance.copySelected(); break;
                        case 'v': e.preventDefault(); swwInstance.pasteClipboard(); break;
                        case 'd': e.preventDefault(); copyPaste(); break;
                    }
                } else {
                    switch (e.key) {
                        case 'Delete': case 'Backspace': e.preventDefault(); swwInstance.deleteSelectedElements(); break;
                        case 'Escape': swwInstance.clearSelection(); break;
                        case '1': selectTool('select'); break;
                        case '2': selectTool('rectangle'); break;
                        case '3': selectTool('ellipse'); break;
                        case '4': selectTool('arrow'); break;
                        case '5': selectTool('text'); break;
                    }
                }
            });
        }

        function setupEventListeners() {
            const canvas = swwInstance?.canvas;
            if (canvas) {
                canvas.addEventListener('mouseup', () => setTimeout(updateLayersList, 100));
                document.addEventListener('keyup', (e) => {
                    if (e.key === 'Delete' || e.key === 'Backspace') setTimeout(updateLayersList, 100);
                });
            }
            setInterval(updateLayersList, 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key === 'h') {
                alert('Keyboard Shortcuts:\n\nTools:\n1 - Select\n2 - Rectangle\n3 - Circle\n4 - Arrow\n5 - Text\n\nActions:\nCtrl+Z - Undo\nCtrl+Y - Redo\nCtrl+A - Select All\nCtrl+C - Copy\nCtrl+V - Paste\nCtrl+D - Duplicate\nDelete - Delete Selected\nEscape - Clear Selection\n\nAlt+H - Show this help');
            }
        });
    </script>
</body>
</html>
