<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SenangWebs Whiteboard</title>

    <!-- SWW Library Files (with built-in SenangStart Icons and Marked) -->
    <link rel="stylesheet" href="../dist/sww.min.css" />
    <script src="../dist/sww.min.js"></script>
  </head>
  <body>
    <!-- Main Application Container -->
    <div class="sww-editor-container">
      <!-- Left Control Panel -->
      <div class="sww-control-panel" id="sww-control-panel">
        <!-- Panel Header -->
        <div class="sww-control-header">
          <div><h4>SW Whiteboard</h4></div>
          <div class="sww-control-header-actions">
            <button
              class="sww-panel-button"
              onclick="togglePanelWidth()"
              title="Expand Panel Width"
              id="toggle-width-btn"
            >
              <i class="ss ss-maximize"></i>
            </button>
            <button
              class="sww-panel-button active"
              onclick="togglePanelDock()"
              title="Dock Panel"
              id="toggle-dock-btn"
            >
              <i class="ss ss-bookmark"></i>
            </button>
          </div>
        </div>

        <!-- Menu Navigation -->
        <div class="sww-control-menu">
          <button class="sww-control-menu-button active" data-menu="elements">
            <i class="ss ss-layout"></i>
            <span>Elements</span>
          </button>
          <button class="sww-control-menu-button" data-menu="layers">
            <i class="ss ss-layer-stacks"></i>
            <span>Layers</span>
          </button>
        </div>

        <!-- Elements Section -->
        <div id="sww-elements-section" class="sww-control-section">
          <div class="sww-elements-grid">
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('rectangle')"
            >
              <i class="ss ss-square"></i> Rectangle
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('ellipse')"
            >
              <i class="ss ss-circle"></i> Ellipse
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('diamond')"
            >
              <i class="ss ss-diamond"></i> Diamond
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('parallelogram')"
            >
              <i class="ss ss-square" style="transform: skew(-15deg, 0deg)"></i>
              Parallelogram
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('star')"
            >
              <i class="ss ss-star"></i> Star
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('draw')"
            >
              <i class="ss ss-draw-curve"></i> Draw
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('line')"
            >
              <i class="ss ss-draw-line"></i> Line
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('arrow')"
            >
              <i class="ss ss-arrow-right"></i> Arrow
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('text')"
            >
              <i class="ss ss-text"></i> Text
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('image')"
            >
              <i class="ss ss-photo"></i> Image
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('website')"
            >
              <i class="ss ss-globe-alt"></i> Website
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('markdown')"
            >
              <i class="ss ss-document-text"></i> Document
            </button>
            <button
              class="sww-action-button"
              onclick="swwInstance.setTool('table')"
            >
              <i class="ss ss-table"></i> Table
            </button>
          </div>
        </div>

        <!-- Layers Section -->
        <div
          id="sww-layers-section"
          class="sww-control-section"
          style="display: none"
        >
          <div class="sww-layer-header">
            <div class="sww-layer-heading">
              <h3>Layers <span class="sww-layer-count" id="layer-count">0</span></h3>
              <span class="sww-layer-selection-count" id="layer-selection-count" aria-live="polite">None selected</span>
            </div>
            <div class="sww-layer-bulk-actions" role="group" aria-label="Layer selection actions">
              <button type="button" id="layers-select-all" class="sww-layer-action-btn sww-layer-text-action" onclick="swwInstance.selectAll()" title="Select all layers">
                <i class="ss ss-check" aria-hidden="true"></i><span>Select all</span>
              </button>
              <button type="button" id="layers-clear-selection" class="sww-layer-action-btn sww-layer-text-action" onclick="swwInstance.clearSelection()" title="Clear selection" disabled>
                <span>Clear</span>
              </button>
              <span class="sww-layer-action-spacer"></span>
              <button type="button" id="layers-duplicate" class="sww-layer-action-btn" onclick="swwInstance.copySelected(); swwInstance.pasteClipboard();" title="Duplicate selected layers" aria-label="Duplicate selected layers" disabled>
                <i class="ss ss-document-duplicate" aria-hidden="true"></i>
              </button>
              <button type="button" id="layers-delete" class="sww-layer-action-btn sww-layer-delete" onclick="swwInstance.deleteSelectedElements()" title="Delete selected layers" aria-label="Delete selected layers" disabled>
                <i class="ss ss-trash" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="sww-layers-container" id="sww-layers-list" role="list" aria-label="Scene layers">
            <div class="sww-layers-empty">
              <i class="ss ss-layer-stacks" aria-hidden="true"></i>
              <strong>No layers yet</strong>
              <span>Add a shape, table, or drawing to get started.</span>
            </div>
          </div>
        </div>

        <!-- Customize Section -->
        <div
          id="sww-customize-section"
          class="sww-control-section"
          style="display: none"
        >
          <div style="padding: 20px; text-align: center; color: #ffffff80">
            No elements selected. Select an element to customize its properties.
          </div>
        </div>
      </div>

      <!-- Main Canvas Area -->
      <div class="sww-canvas-area" id="sww-drawing-canvas"></div>
    </div>

    <!-- Bottom Toolbar -->
    <div class="sww-toolbar-container">
      <!-- Zoom Controls -->
      <div id="sww-zoom" class="sww-toolbar-action">
        <button
          class="sww-toolbar-button"
          onclick="swwInstance.zoomIn()"
          title="Zoom In"
          id="zoom-in-btn"
        >
          <i class="ss ss-magnifying-glass-plus"></i>
        </button>
        <button
          class="sww-toolbar-button"
          onclick="swwInstance.zoomOut()"
          title="Zoom Out"
          id="zoom-out-btn"
        >
          <i class="ss ss-magnifying-glass-minus"></i>
        </button>
      </div>

      <!-- Action Controls -->
      <div id="sww-action" class="sww-toolbar-action">
        <button
          class="sww-toolbar-button"
          onclick="swwInstance.undo()"
          title="Undo"
          id="undo-btn"
        >
          <i class="ss ss-arrow-rotate-ccw"></i>
        </button>
        <button
          class="sww-toolbar-button"
          onclick="swwInstance.redo()"
          title="Redo"
          id="redo-btn"
        >
          <i class="ss ss-arrow-rotate-cw"></i>
        </button>
        <!-- <button class="sww-toolbar-button" title="Save">
                <i class="ss ss-save"></i>
            </button> -->
        <button
          class="sww-toolbar-button"
          onclick="swwInstance.togglePreviewMode()"
          title="Preview"
          id="toggle-preview-btn"
        >
          <i class="ss ss-window"></i>
        </button>
        <button
          class="sww-toolbar-button"
          onclick="swwInstance.selectAll()"
          title="Select All"
          id="select-all-btn"
        >
          <i class="ss ss-double-tick"></i>
        </button>
        <button
          class="sww-toolbar-button"
          onclick="swwInstance.clearAll()"
          title="Clear Canvas"
          id="clear-canvas-btn"
        >
          <i class="ss ss-eraser"></i>
        </button>
      </div>

      <!-- Menu Controls -->
      <div id="sww-menu" class="sww-toolbar-action">
        <!-- <button class="sww-toolbar-button" onclick="exportSVG()" title="Export SVG">
                <i class="ss ss-save"></i>
            </button> -->
        <button
          class="sww-toolbar-button"
          onclick="swwInstance.toggleGrid()"
          title="Toggle Grid"
          id="toggle-grid-btn"
        >
          <i class="ss ss-grid"></i>
        </button>
      </div>
    </div>

    <!-- Application Logic -->
    <script>
      // Global variables
      let swwInstance;

      /**
       * Initialize the application when DOM is ready
       */
      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("sww-drawing-canvas");

        // Initialize SWW drawing library
        swwInstance = sww.init(container, {
          backgroundColor: "#ffffff",
          gridSize: 20,
          showGrid: true,
          readOnly: false, // default false
        });
        swwInstance.controlPanel = { updateLayers };
        container.addEventListener("sww:sceneChanged", updateLayers);
        container.addEventListener("sww:selectionChanged", updateLayers);
        updateLayers();

        // NOTE: SWWControlPanel is no longer needed in the modular architecture
        // All control panel functionality is now built into the instance
        // The layers panel updates automatically when elements change

        // Setup menu navigation
        setupMenuNavigation();

        console.log("SenangWebs Whiteboard initialized successfully!");
      });

      /**
       * Setup menu navigation for control panel
       */
      function setupMenuNavigation() {
        const menuButtons = document.querySelectorAll(
          ".sww-control-menu-button"
        );
        const sections = document.querySelectorAll(".sww-control-section");

        menuButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const targetMenu = button.getAttribute("data-menu");

            // Update active button
            menuButtons.forEach((btn) => btn.classList.remove("active"));
            button.classList.add("active");

            // Show/hide sections
            sections.forEach((section) => {
              section.style.display = "none";
            });

            const targetSection = document.getElementById(
              `sww-${targetMenu}-section`
            );
            if (targetSection) {
              targetSection.style.display = targetMenu === "layers" ? "flex" : "block";

              // Layers panel updates automatically when elements change
            }
          });
        });
      }

      /**
       * Toggle panel width between normal and expanded
       */
      function togglePanelWidth() {
        const controlPanel = document.getElementById("sww-control-panel");
        controlPanel.classList.toggle("expanded");
        const toggleWidthBtn = document.getElementById("toggle-width-btn");
        if (controlPanel.classList.contains("expanded")) {
          toggleWidthBtn.title = "Collapse Panel Width";
          toggleWidthBtn.classList.add("active");
        } else {
          toggleWidthBtn.title = "Expand Panel Width";
          toggleWidthBtn.classList.remove("active");
        }
      }

      /**
       * Toggle panel docking between docked and undocked
       */
      function togglePanelDock() {
        const controlPanel = document.getElementById("sww-control-panel");
        controlPanel.classList.toggle("undocked");
        const toggleDockBtn = document.getElementById("toggle-dock-btn");
        if (controlPanel.classList.contains("undocked")) {
          toggleDockBtn.title = "Dock Panel";
          toggleDockBtn.classList.remove("active");
        } else {
          toggleDockBtn.title = "Undock Panel";
          toggleDockBtn.classList.add("active");
        }
      }

      /**
       * Update layers panel to show all elements
       * Called by LayersPanel.js via window.swwControlPanel.updateLayers()
       */
      function updateLayers() {
        if (!swwInstance || !Array.isArray(swwInstance.elements)) return;
        const layersList = document.getElementById("sww-layers-list");
        if (!layersList) return;
        const elements = swwInstance.elements;
        const selectedElements = swwInstance.selectedElements;
        const selectedCount = selectedElements.size;
        document.getElementById("layer-count").textContent = elements.length;
        document.getElementById("layer-selection-count").textContent = selectedCount
          ? selectedCount + " selected" : "None selected";
        document.getElementById("layers-select-all").disabled = !elements.some(element => !element.locked && element.visible !== false);
        for (const id of ["layers-clear-selection", "layers-duplicate", "layers-delete"]) {
          document.getElementById(id).disabled = selectedCount === 0;
        }

        // Keep keyboard focus and scroll position when scene events refresh rows.
        const focused = layersList.contains(document.activeElement) ? document.activeElement : null;
        const focusedId = focused?.closest("[data-element-id]")?.dataset.elementId;
        const focusedAction = focused?.dataset.layerAction;
        const scrollTop = layersList.scrollTop;
        const fragment = document.createDocumentFragment();
        if (elements.length === 0) {
          const empty = document.createElement("div");
          empty.className = "sww-layers-empty";
          empty.innerHTML = '<i class="ss ss-layer-stacks" aria-hidden="true"></i><strong>No layers yet</strong><span>Add a shape, table, or drawing to get started.</span>';
          fragment.appendChild(empty);
        }
        elements.forEach((element, index) => {
          if (!element?.id || !element?.type) return;
          const selected = selectedElements.has(element);
          const hidden = element.visible === false;
          const locked = !!element.locked;
          const name = element.type.charAt(0).toUpperCase() + element.type.slice(1) + " " + (index + 1);
          const row = document.createElement("div");
          row.className = "sww-layer-item";
          row.classList.toggle("selected", selected);
          row.classList.toggle("is-hidden", hidden);
          row.classList.toggle("locked", locked);
          row.dataset.elementId = element.id;
          row.setAttribute("role", "listitem");
          const select = document.createElement("button");
          select.type = "button";
          select.className = "sww-layer-info";
          select.dataset.layerAction = "select";
          select.setAttribute("aria-pressed", String(selected));
          select.title = "Select " + name;
          const icon = document.createElement("span");
          icon.className = "sww-layer-icon";
          const glyph = document.createElement("i");
          glyph.className = "ss ss-" + getLayerIcon(element.type);
          glyph.setAttribute("aria-hidden", "true");
          icon.appendChild(glyph);
          const text = document.createElement("span");
          text.className = "sww-layer-label";
          const label = document.createElement("span");
          label.className = "sww-layer-name";
          label.textContent = name;
          text.appendChild(label);
          if (hidden || locked) {
            const status = document.createElement("span");
            status.className = "sww-layer-status";
            status.textContent = [hidden && "Hidden", locked && "Locked"].filter(Boolean).join(" ? ");
            text.appendChild(status);
          }
          select.append(icon, text);
          select.addEventListener("click", () => selectLayerElement(element.id));
          const actions = document.createElement("div");
          actions.className = "sww-layer-actions";
          for (const [action, iconName, actionLabel, handler, pressed] of [
            ["visibility", hidden ? "eye-slash" : "eye", hidden ? "Show" : "Hide", toggleLayerVisibility, hidden],
            ["lock", locked ? "lock-closed" : "lock-open", locked ? "Unlock" : "Lock", toggleLayerLock, locked],
            ["delete", "trash", "Delete", deleteLayerElement],
          ]) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "sww-layer-action-btn" + (action === "delete" ? " sww-layer-delete" : "");
            button.dataset.layerAction = action;
            button.title = actionLabel + " " + name;
            const toggleLabel = action === "visibility" ? "Hide" : action === "lock" ? "Lock" : actionLabel;
            button.setAttribute("aria-label", toggleLabel + " " + name);
            if (pressed !== undefined) button.setAttribute("aria-pressed", String(pressed));
            const actionIcon = document.createElement("i");
            actionIcon.className = "ss ss-" + iconName;
            actionIcon.setAttribute("aria-hidden", "true");
            button.appendChild(actionIcon);
            button.addEventListener("click", () => handler(element.id));
            actions.appendChild(button);
          }
          row.append(select, actions);
          fragment.appendChild(row);
        });
        layersList.replaceChildren(fragment);
        layersList.scrollTop = scrollTop;
        if (focusedId && focusedAction) {
          const row = [...layersList.children].find(item => item.dataset.elementId === focusedId);
          const target = row?.querySelector('[data-layer-action="' + focusedAction + '"]');
          if (target) target.focus({ preventScroll: true });
          else layersList.querySelector(".sww-layer-info")?.focus({ preventScroll: true });
        }
      }

      /**
       * Get SenangStart icon for element type
       */
      function getLayerIcon(type) {
        const icons = {
          rectangle: "square",
          ellipse: "circle",
          diamond: "diamond",
          star: "star",
          parallelogram: "square",
          arrow: "arrow-right",
          line: "draw-line",
          text: "text",
          path: "draw-curve",
          image: "photo",
          website: "globe-alt",
          markdown: "document-text",
          table: "table",
        };
        return icons[type] || "shapes";
      }

      /**
       * Select element from layers panel
       */
      function selectLayerElement(elementId) {
        if (swwInstance && swwInstance.selectElementById) {
          swwInstance.selectElementById(elementId);
          updateLayers();
        }
      }

      /**
       * Toggle element visibility from layers panel
       */
      function toggleLayerVisibility(elementId) {
        if (swwInstance && swwInstance.toggleElementVisibility) {
          swwInstance.toggleElementVisibility(elementId);
          updateLayers();
        }
      }

      /**
       * Toggle element lock from layers panel
       */
      function toggleLayerLock(elementId) {
        if (swwInstance && swwInstance.toggleElementLock) {
          swwInstance.toggleElementLock(elementId);
          updateLayers();
        }
      }

      /**
       * Delete element from layers panel
       */
      function deleteLayerElement(elementId) {
        if (swwInstance && swwInstance.deleteElementById) {
          swwInstance.deleteElementById(elementId);
          updateLayers();
        }
      }

    </script>
  </body>
</html>
